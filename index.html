function buyPlant(){

 for(let i=0;i<9;i++){const m=treeM(),o=new THREE.Group(),x=(i%3-1)*1.05,z=-5.2+(Math.floor(i/3)-1)*1.05;o.scale.setScalar(.6);o.add(m);o.position.set(x,0,z);m.scale.setScalar(.25);sc.add(o);S.plant.push({m,o,x,z,g:0,pl:true,tg:false})}

 if(k==='dmg'||k==='tdmg'||k==='gdmg'){const key=k==='dmg'?'dm':k==='tdmg'?'td':'gd',c=Math.ceil(4*Math.pow(1.5,(S[key]-1)/.5));if(S.teeth>=c){S.teeth-=c;S[key]+=.5}return true}

function burst(x,y,z,c,s){const m=new THREE.Mesh(new THREE.SphereGeometry(.35,8,6),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:1}));m.position.set(x,y,z);sc.add(m);S.fx.push({ln:m,l:.3,l0:.3,sc:s})}
const lodge=new THREE.Group();
{const d=new THREE.Mesh(new THREE.SphereGeometry(3,16,10,0,6.3,0,1.57),mat.wood);lodge.add(d);
 const dr=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.6,.3),mat.dark);dr.position.set(0,.8,2.85);lodge.add(dr);
 for(let i=0;i<26;i++){const a=i/26*6.283,p=new THREE.Mesh(new THREE.CylinderGeometry(.22,.25,2,5),mat.wood);p.position.set(Math.cos(a)*8.5,1,Math.sin(a)*8.5);lodge.add(p)}
 lodge.position.set(0,0,0);sc.add(lodge)}
const cost={tower:()=>Math.round(15*Math.pow(1.4,S.towers.length)),cutter:()=>Math.round(12*Math.pow(1.35,S.cutters.length)),cap:()=>Math.round(20*Math.pow(1.5,(S.cap-10)/5)),repair:()=>10,plant:()=>Math.round(25*Math.pow(1.6,S.plant.length/4)),guard:()=>Math.round(30*Math.pow(1.4,S.guards.length)),dmg:()=>Math.round(20*Math.pow(1.5,(S.dm-1)/.5)),tdmg:()=>Math.round(25*Math.pow(1.5,(S.td-1)/.5)),wall:()=>Math.round(30*Math.pow(1.7,S.wall))};
let S,yaw=0;
function clear(){if(S){for(const t of S.trees){sc.remove(t.m);if(t.ring)sc.remove(t.ring)}for(const f of S.foxes){sc.remove(f.m);f.eb.remove()}for(const t of S.towers)sc.remove(t.m);for(const t of S.plant){sc.remove(t.o);if(t.ring)sc.remove(t.ring)}for(const t of S.guards)sc.remove(t.m);if(S.wg)sc.remove(S.wg);if(S.dome)sc.remove(S.dome);if(S.pw)sc.remove(S.pw.m);for(const d of S.drops)sc.remove(d);for(const c of S.cutters)sc.remove(c.m);sc.remove(S.bv.m);for(const f of S.fx)sc.remove(f.ln)}}
function init(){
 clear();
 S={wood:0,carry:0,cap:10,hp:100,wave:0,next:10,kills:0,over:false,trees:[],foxes:[],towers:[],cutters:[],fx:[],plant:[],guards:[],rg:5,dm:1,td:1,wall:0,wg:null,teeth:0,gd:1,drops:[],seen:{},dome:null,pw:null,bv:{m:beaver(0x9a6a35,1),x:0,z:12,chop:null,t:0}};
 sc.add(S.bv.m);S.bv.lg=new THREE.Group();S.bv.m.add(S.bv.lg);

  const a=Math.random()*6.283,r=11+Math.sqrt(Math.random())*34,x=Math.cos(a)*r,z=Math.sin(a)*r;

}
function buy(k){
 if(buyZ(k))return;const c=cost[k]();if(S.wood<c)return;
 if(k==='tower'&&S.towers.length<7){S.wood-=c;const a=(S.towers.length+(S.towers.length>=6?1:0))*Math.PI/4,m=new THREE.Group(),p=new THREE.Mesh(new THREE.CylinderGeometry(.6,.8,2.2,8),mat.wood),q=new THREE.Mesh(new THREE.ConeGeometry(.9,.9,8),mat.dark);q.position.y=1.6;m.add(p,q);m.position.set(Math.cos(a)*7.4,1.1,Math.sin(a)*7.4);sc.add(m);S.towers.push({m,x:m.position.x,z:m.position.z,cd:0})}
 else if(k==='cutter'&&S.cutters.length<10){S.wood-=c;const m=beaver(0xc79a5a,.7);m.position.set(0,0,5);sc.add(m);S.cutters.push({m,x:0,z:5,t:null,tm:0})}

 else if(k==='plant'&&S.plant.length<16){S.wood-=c;const a=(Math.floor(S.plant.length/4)*2+1)*Math.PI/4,cx=Math.cos(a)*4.9,cz=Math.sin(a)*4.9;for(let i=0;i<4;i++){const m=treeM(),x=cx+(i%2?.55:-.55),z=cz+(i<2?.55:-.55);m.scale.setScalar(.25);m.position.set(x,0,z);sc.add(m);S.plant.push({m,x,z,g:0,pl:true,tg:false})}}
 else if(k==='guard'&&S.guards.length<6){S.wood-=c;const m=beaver(0x6f8fd0,.8);m.position.set(0,0,10);sc.add(m);S.guards.push({m,x:0,z:10,bt:0})}
 else if(k==='dmg'){S.wood-=c;S.dm+=.5}
 else if(k==='tdmg'){S.wood-=c;S.td+=.5}
 else if(k==='wall'&&S.wall<5){S.wood-=c;S.wall++;wallUp()}
 else if(k==='repair'&&S.hp<100){S.wood-=c;S.hp=Math.min(100,S.hp+30)}
}
[['b1','tower'],['b2','cutter'],['b3','guard'],['b4','plant'],['b5','dmg'],['b6','tdmg'],['b7','cap'],['b8','repair'],['b9','wall']].forEach(([i,k])=>$(i).onclick=()=>buy($(i).dataset.k||k));$('re').onclick=init;$('b0').onclick=()=>buy('repair');
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let jo=null,jv={x:0,y:0},cd=null;

const up=e=>{if(jo&&e.pointerId===jo.id){jo=null;jv={x:0,y:0};$('jb').style.display=$('jk').style.display='none'}if(cd&&e.pointerId===cd.id)cd=null};

function update(dt){

 if(keys.q)yaw+=1.8*dt;if(keys.e)yaw-=1.8*dt;

 while(b.lg.children.length>want)b.lg.remove(b.lg.children[b.lg.children.length-1]);

  c.m.position.set(c.x,0,c.z);
 }
